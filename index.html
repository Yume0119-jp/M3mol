<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mεmol - 30秒メモ</title>
    <style>
      /* ===== リセット ===== */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button, textarea { font: inherit; color: inherit; border: 0; background: none; }
      button { cursor: pointer; }
      svg { display: block; flex-shrink: 0; }

      /* ===== ベース ===== */
      :root {
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-400: #9ca3af;
        --gray-600: #4b5563;
        --gray-700: #374151;
        --gray-800: #1f2937;
        --teal-500: #14b8a6;
        --teal-600: #0d9488;
        --red-50: #fef2f2;
        --red-100: #fee2e2;
        --red-500: #ef4444;
        --red-600: #dc2626;
      }
      html { -webkit-text-size-adjust: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
        line-height: 1.5;
        background: var(--gray-50);
        color: var(--gray-800);
        height: 100vh;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        overscroll-behavior-y: none; /* スマホでのスクロールバウンスを防ぐ */
      }

      /* ===== レイアウト ===== */
      .app {
        width: 100%;
        max-width: 28rem;
        height: 100%;
        background: #fff;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--gray-100);
        background: #fff;
        z-index: 10;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--gray-800);
        display: flex;
        align-items: baseline;
      }
      h1 .accent { color: var(--teal-500); }
      h1 .ver {
        font-size: 13px;
        color: var(--gray-400);
        margin-left: 0.5rem;
        letter-spacing: normal;
      }

      #save-indicator {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--teal-500);
        opacity: 0;
        transition: opacity 0.3s;
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      main {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      #main-editor {
        width: 100%;
        flex: 1;
        min-height: 0;
        padding: 1.25rem;
        font-size: 1.125rem;
        line-height: 1.625;
        resize: none;
        outline: none;
        background: transparent;
      }
      #main-editor::placeholder { color: #94a3b8; font-weight: 400; }

      footer {
        padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
        background: #fff;
        border-top: 1px solid var(--gray-100);
        display: flex;
        gap: 0.75rem;
        z-index: 10;
      }
      @media (min-width: 640px) {
        footer { padding-bottom: 1rem; }
      }

      /* ===== ボタン ===== */
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        font-weight: 500;
        transition: all 0.15s;
      }
      .btn:active { transform: scale(0.95); }
      .btn-gray { background: var(--gray-100); color: var(--gray-700); }
      .btn-gray:hover { background: var(--gray-200); }
      .btn-teal {
        background: var(--teal-500);
        color: #fff;
        box-shadow: 0 10px 15px -3px rgba(20, 184, 166, 0.3), 0 4px 6px -4px rgba(20, 184, 166, 0.3);
      }
      .btn-teal:hover { background: var(--teal-600); }
      .btn-red {
        background: var(--red-500);
        color: #fff;
        box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3), 0 4px 6px -4px rgba(239, 68, 68, 0.3);
      }
      .btn-red:hover { background: var(--red-600); }
      #btn-history { flex: 1; }
      #btn-save-new { flex: 2; }
      #btn-preview { flex: 1; }
      .btn { white-space: nowrap; }
      #btn-history, #btn-preview { padding-left: 0.375rem; padding-right: 0.375rem; }
      #btn-save-new { padding-left: 0.5rem; padding-right: 0.5rem; }
      .btn .when-edit, .btn .when-view { display: flex; align-items: center; gap: 0.375rem; }
      /* 狭い画面（〜360px）ではフッターを少し詰めてはみ出しを防ぐ */
      @media (max-width: 360px) {
        footer { padding-left: 0.75rem; padding-right: 0.75rem; gap: 0.5rem; }
        footer .btn { font-size: 0.875rem; gap: 0.375rem; }
        footer .btn svg { width: 18px; height: 18px; }
        #btn-history, #btn-preview { padding-left: 0.25rem; padding-right: 0.25rem; }
        #btn-save-new { padding-left: 0.375rem; padding-right: 0.375rem; }
      }
      #btn-preview .when-view { display: none; }
      #btn-preview.on .when-edit { display: none; }
      #btn-preview.on .when-view { display: flex; }

      /* ===== 履歴パネル (Bottom Sheet) ===== */
      #history-panel {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        pointer-events: none;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #history-panel.open { transform: translateY(0); }
      #history-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.2);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .sheet {
        background: var(--gray-50);
        height: 85%;
        border-radius: 1.5rem 1.5rem 0 0;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        pointer-events: auto;
        position: relative;
        z-index: 10;
      }
      .sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem;
        background: #fff;
        border-radius: 1.5rem 1.5rem 0 0;
        border-bottom: 1px solid var(--gray-200);
      }
      .sheet-header h2 { font-size: 1.125rem; font-weight: 700; color: var(--gray-800); }
      .sheet-actions { display: flex; align-items: center; gap: 0.5rem; }
      .round-btn {
        padding: 0.5rem;
        background: var(--gray-100);
        border-radius: 9999px;
        color: var(--gray-600);
        transition: all 0.15s;
      }
      .round-btn:hover { background: var(--gray-200); }
      .round-btn:active { transform: scale(0.95); }

      #history-list {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      #history-list::-webkit-scrollbar { display: none; }

      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 10rem;
        color: var(--gray-400);
        font-size: 0.875rem;
        gap: 0.5rem;
      }
      .empty svg { opacity: 0.5; }

      .card {
        background: #fff;
        padding: 1rem;
        border-radius: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--gray-100);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        overflow: hidden;
        flex-shrink: 0;
      }
      .card-text {
        color: var(--gray-700);
        word-break: break-word;
        overflow-wrap: anywhere;
        font-size: 0.875rem;
        line-height: 1.6;
        position: relative;
      }
      .card-text.collapsed { max-height: 9rem; overflow: hidden; }
      .card-text.clamped { cursor: pointer; }
      .card-text.collapsed.clamped::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2.5rem;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff);
        pointer-events: none;
      }

      /* 行ごとの書式（# の数で変わる）。サイズは親の文字サイズに対する割合 */
      .ln { white-space: pre-wrap; min-height: 1.6em; }
      .ln.h1 { font-size: 1.4286em; font-weight: 700; line-height: 1.4; color: var(--gray-800); }  /* # タイトル（1行目は自動でこれ） */
      .ln.h2 { font-size: 1.2571em; font-weight: 700; color: var(--gray-800); }                    /* ## サブタイトル */
      .ln.h3 { font-size: 1.1429em; font-weight: 700; color: var(--gray-700); }                    /* ### サブサブタイトル */
      .ln.h4 { font-size: 1em; }                                                                   /* #### 原文 */
      .ln.h5 { font-size: 0.857em; color: var(--gray-600); }                                       /* ##### ひとまわり小さい文 */

      /* リンク */
      .card-text a, #preview a {
        color: #2563eb;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* 書体指定の解除・コードブロック（文字色や下線はインラインstyleで付ける） */
      .plain { font-weight: 400; font-style: normal; text-decoration: none; background: none; }
      .codeblock {
        margin: 0.25rem 0;
        padding: 0.625rem 0.75rem;
        background: var(--gray-100);
        border: 1px solid var(--gray-200);
        border-radius: 0.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans Mono CJK JP', monospace;
        font-size: 0.8125em;
        line-height: 1.5;
        color: var(--gray-800);
        white-space: pre;
        overflow-x: auto;
        overflow-wrap: normal;
        word-break: normal;
      }

      /* メイン画面でのプレビュー表示 */
      #preview {
        display: none;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 1.25rem;
        font-size: 1.125rem;
        line-height: 1.625;
        color: var(--gray-800);
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      #preview .hint { color: #94a3b8; }
      #main-area.previewing #preview { display: block; }
      #main-area.previewing #main-editor { display: none; }
      .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.25rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--gray-50);
      }
      .card-time { font-size: 0.75rem; color: var(--gray-400); font-weight: 500; }
      .card-actions { display: flex; gap: 0.5rem; }
      .icon-btn {
        width: 2rem;
        height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        transition: background-color 0.15s;
      }
      .icon-btn.copy { background: var(--gray-50); color: var(--gray-600); }
      .icon-btn.copy:hover { background: var(--gray-100); }
      .icon-btn.edit { background: #f0fdfa; color: var(--teal-600); }
      .icon-btn.edit:hover { background: #ccfbf1; }

      /* 編集中バー */
      #edit-banner {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.5rem 1.25rem;
        background: #f0fdfa;
        border-bottom: 1px solid #ccfbf1;
        color: var(--teal-600);
        font-size: 0.8125rem;
        font-weight: 500;
      }
      #edit-banner.show { display: flex; }
      #edit-banner .label { display: flex; align-items: center; gap: 0.375rem; }
      #btn-cancel-edit {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        background: #fff;
        border: 1px solid #99f6e4;
        color: var(--teal-600);
        font-size: 0.8125rem;
        font-weight: 500;
      }
      #btn-cancel-edit:active { transform: scale(0.95); }
      .icon-btn.del { background: var(--red-50); color: var(--red-500); }
      .icon-btn.del:hover { background: var(--red-100); }

      /* ===== トースト ===== */
      #toast {
        position: absolute;
        top: 4rem;
        left: 50%;
        transform: translateX(-50%);
        background: var(--gray-800);
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 70;
        white-space: nowrap;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      }

      /* ===== 削除確認モーダル ===== */
      #confirm-modal {
        position: absolute;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #confirm-modal.open { pointer-events: auto; }
      #confirm-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
        transition: opacity 0.3s;
      }
      #confirm-modal.open #confirm-backdrop { opacity: 1; }
      #confirm-dialog {
        background: #fff;
        border-radius: 1rem;
        padding: 1.5rem;
        width: 85%;
        max-width: 24rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        transform: scale(0.95);
        opacity: 0;
        transition: all 0.3s;
        position: relative;
        z-index: 10;
      }
      #confirm-modal.open #confirm-dialog { transform: scale(1); opacity: 1; }
      #confirm-dialog h3 { font-size: 1.125rem; font-weight: 700; color: var(--gray-800); margin-bottom: 0.5rem; }
      #confirm-dialog p { font-size: 0.875rem; color: var(--gray-600); margin-bottom: 1.5rem; }
      #confirm-dialog .row { display: flex; gap: 0.75rem; }
      #confirm-dialog .btn { flex: 1; padding: 0.625rem 1rem; }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ヘッダー -->
      <header>
        <h1>
          M<span class="accent">ε</span>mol
          <span class="ver">- v0.01</span>
        </h1>
        <div id="save-indicator">
          <span data-icon="check" data-size="14"></span>
          保存済み
        </div>
      </header>

      <!-- メイン入力エリア -->
      <main id="main-area">
        <div id="edit-banner">
          <span class="label"><span data-icon="edit" data-size="14"></span>履歴のメモを編集中</span>
          <button id="btn-cancel-edit">キャンセル</button>
        </div>
        <textarea id="main-editor" placeholder="ここにパパッとメモ..."></textarea>
        <div id="preview"></div>
      </main>

      <!-- 下部アクションバー -->
      <footer>
        <button id="btn-history" class="btn btn-gray">
          <span data-icon="list" data-size="20"></span>
          履歴
        </button>
        <button id="btn-preview" class="btn btn-gray" aria-pressed="false">
          <span class="when-edit"><span data-icon="eye" data-size="20"></span>表示</span>
          <span class="when-view"><span data-icon="edit" data-size="20"></span>編集</span>
        </button>
        <button id="btn-save-new" class="btn btn-teal">
          <span data-icon="send" data-size="20"></span>
          <span id="save-label">保存して次へ</span>
        </button>
      </footer>

      <!-- 履歴パネル (Bottom Sheet) -->
      <div id="history-panel">
        <div id="history-backdrop"></div>
        <div class="sheet">
          <div class="sheet-header">
            <h2>過去のメモ</h2>
            <div class="sheet-actions">
              <button id="btn-import" class="round-btn" aria-label="読み込み (.memol)" title="読み込み (.memol)">
                <span data-icon="upload" data-size="18"></span>
              </button>
              <button id="btn-export" class="round-btn" aria-label="書き出し (.memol)" title="書き出し (.memol)">
                <span data-icon="download" data-size="18"></span>
              </button>
              <button id="btn-close-history" class="round-btn" aria-label="閉じる">
                <span data-icon="x" data-size="18"></span>
              </button>
            </div>
            <input type="file" id="import-file" hidden />
          </div>
          <div id="history-list"></div>
        </div>
      </div>

      <!-- トースト通知 -->
      <div id="toast">コピーしました</div>

      <!-- 削除確認モーダル -->
      <div id="confirm-modal">
        <div id="confirm-backdrop"></div>
        <div id="confirm-dialog">
          <h3>メモを削除しますか？</h3>
          <p>この操作は取り消せません。</p>
          <div class="row">
            <button id="btn-cancel-delete" class="btn btn-gray">キャンセル</button>
            <button id="btn-confirm-delete" class="btn btn-red">削除する</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
          // --- アイコン（インラインSVG。外部読み込み不要） ---
          const ICONS = {
              check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
              list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
              send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
              x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
              copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
              trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
              download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
              upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
              eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
              edit: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
              file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>'
          };
          function icon(name, size) {
              return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
          }
          document.querySelectorAll('[data-icon]').forEach(el => {
              el.outerHTML = icon(el.dataset.icon, el.dataset.size || 20);
          });

          // --- UI Elements ---
          const editor = document.getElementById('main-editor');
          const indicator = document.getElementById('save-indicator');
          const btnSaveNew = document.getElementById('btn-save-new');
          const btnHistory = document.getElementById('btn-history');
          const historyPanel = document.getElementById('history-panel');
          const historyBackdrop = document.getElementById('history-backdrop');
          const btnCloseHistory = document.getElementById('btn-close-history');
          const historyList = document.getElementById('history-list');
          const toast = document.getElementById('toast');
          const editBanner = document.getElementById('edit-banner');
          const btnCancelEdit = document.getElementById('btn-cancel-edit');
          const saveLabel = document.getElementById('save-label');
          const btnImport = document.getElementById('btn-import');
          const btnExport = document.getElementById('btn-export');
          const importFile = document.getElementById('import-file');
          const mainArea = document.getElementById('main-area');
          const previewEl = document.getElementById('preview');
          const btnPreview = document.getElementById('btn-preview');

          const confirmModal = document.getElementById('confirm-modal');
          const confirmBackdrop = document.getElementById('confirm-backdrop');
          const btnCancelDelete = document.getElementById('btn-cancel-delete');
          const btnConfirmDelete = document.getElementById('btn-confirm-delete');

          // --- State ---
          const STORAGE_KEY_CURRENT = 'memol_current_draft';
          const STORAGE_KEY_HISTORY = 'memol_history';
          let saveTimeout;
          const STORAGE_KEY_EDIT = 'memol_edit_state';
          let memoToDeleteId = null;
          let editingId = null;     // 編集中の履歴メモID（なければ null）
          let stashedDraft = '';    // 編集前に書いていた下書き（編集後に元へ戻す）
          let previewing = false;   // メイン画面で整形表示中か

          // --- Initialize ---
          // 前回書きかけのメモがあれば復元
          const savedDraft = localStorage.getItem(STORAGE_KEY_CURRENT);
          if (savedDraft) {
              editor.value = savedDraft;
          }

          // 編集中のままページを閉じた場合は編集状態を復元
          try {
              const es = JSON.parse(localStorage.getItem(STORAGE_KEY_EDIT) || 'null');
              if (es && getHistory().some(m => m.id === es.id)) {
                  editingId = es.id;
                  stashedDraft = es.stash || '';
                  updateEditUI();
              } else if (es) {
                  localStorage.removeItem(STORAGE_KEY_EDIT);
              }
          } catch (e) {}

          // ロード時に自動的にフォーカスを当てる
          setTimeout(() => editor.focus(), 100);

          // --- Event Listeners ---

          // 入力中の自動保存機能
          editor.addEventListener('input', () => {
              localStorage.setItem(STORAGE_KEY_CURRENT, editor.value);

              clearTimeout(saveTimeout);
              indicator.style.opacity = '1';
              saveTimeout = setTimeout(() => {
                  indicator.style.opacity = '0';
              }, 2000);
          });

          // 「保存して次へ」ボタン
          btnSaveNew.addEventListener('click', () => {
              const text = editor.value.trim();
              if (!text) {
                  showToast('メモが空です');
                  return;
              }

              // 履歴のメモを編集中なら上書き保存して、元の下書きに戻る
              if (editingId) {
                  updateMemo(editingId, text);
                  endEdit();
                  setPreview(false);
                  showToast('更新しました');
                  return;
              }

              saveToHistory(text);

              editor.value = '';
              localStorage.removeItem(STORAGE_KEY_CURRENT);
              setPreview(false); // 編集画面に戻ってフォーカス

              showToast('保存しました');
          });

          // 編集キャンセル
          btnCancelEdit.addEventListener('click', () => {
              endEdit();
              setPreview(false);
              showToast('編集をキャンセルしました');
          });

          // 履歴パネルの開閉
          btnHistory.addEventListener('click', () => {
              renderHistory();
              historyPanel.classList.add('open');
              historyBackdrop.style.opacity = '1';
              historyBackdrop.style.pointerEvents = 'auto';
          });

          const closeHistory = () => {
              historyPanel.classList.remove('open');
              historyBackdrop.style.opacity = '0';
              historyBackdrop.style.pointerEvents = 'none';
              setTimeout(() => editor.focus(), 300);
          };

          btnCloseHistory.addEventListener('click', closeHistory);
          btnExport.addEventListener('click', exportMemos);

          // 履歴に行かずに、今のメモを整形表示で確認
          btnPreview.addEventListener('click', () => setPreview(!previewing));
          previewEl.addEventListener('click', (e) => {
              if (e.target.closest('a')) return;                          // リンクはそのまま開く
              if (window.getSelection && window.getSelection().toString()) return; // 文字選択中は編集に戻らない
              setPreview(false);                                          // タップで編集に戻る
          });
          btnImport.addEventListener('click', () => importFile.click());
          importFile.addEventListener('change', () => {
              const file = importFile.files && importFile.files[0];
              if (file) importMemos(file);
              importFile.value = ''; // 同じファイルをもう一度選べるように
          });
          historyBackdrop.addEventListener('click', closeHistory);

          btnCancelDelete.addEventListener('click', closeConfirmModal);
          confirmBackdrop.addEventListener('click', closeConfirmModal);

          btnConfirmDelete.addEventListener('click', () => {
              if (memoToDeleteId) {
                  if (memoToDeleteId === editingId) endEdit(); // 編集中のメモを消すなら編集も終了
                  deleteFromHistory(memoToDeleteId);
                  showToast('削除しました');
                  closeConfirmModal();
              }
          });

          // --- Functions ---

          function saveToHistory(text) {
              const history = getHistory();
              history.unshift({
                  id: Date.now().toString(),
                  text: text,
                  timestamp: new Date().toISOString()
              });
              localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
          }

          // --- 入出力（.memol = JSON） ---
          function pad2(n) { return String(n).padStart(2, '0'); }

          function exportMemos() {
              const memos = getHistory();
              if (memos.length === 0) {
                  showToast('書き出すメモがありません');
                  return;
              }
              const data = {
                  app: 'memol',
                  version: 1,
                  exportedAt: new Date().toISOString(),
                  memos: memos
              };
              const d = new Date();
              const name = `memol-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.memol`;
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/octet-stream' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = name;
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
              showToast(`${memos.length}件を書き出しました`);
          }

          function importMemos(file) {
              const reader = new FileReader();
              reader.onerror = () => showToast('ファイルを読み込めませんでした');
              reader.onload = () => {
                  let list;
                  try {
                      const data = JSON.parse(reader.result);
                      list = Array.isArray(data) ? data : data.memos;
                  } catch (e) {
                      list = null;
                  }
                  if (!Array.isArray(list)) {
                      showToast('.memol ファイルではありません');
                      return;
                  }

                  // 形式チェックして整える
                  const incoming = [];
                  list.forEach(m => {
                      if (!m || typeof m.id !== 'string' || typeof m.text !== 'string' || !m.text.trim()) return;
                      const ts = new Date(m.timestamp);
                      const memo = {
                          id: m.id,
                          text: m.text,
                          timestamp: isNaN(ts) ? new Date().toISOString() : ts.toISOString()
                      };
                      if (m.updatedAt && !isNaN(new Date(m.updatedAt))) memo.updatedAt = new Date(m.updatedAt).toISOString();
                      incoming.push(memo);
                  });
                  if (incoming.length === 0) {
                      showToast('読み込めるメモがありませんでした');
                      return;
                  }

                  // 今のメモにマージ（同じIDは新しい方を採用）
                  const stamp = m => new Date(m.updatedAt || m.timestamp).getTime();
                  const byId = new Map(getHistory().map(m => [m.id, m]));
                  let added = 0;
                  let updated = 0;
                  incoming.forEach(m => {
                      const cur = byId.get(m.id);
                      if (!cur) {
                          byId.set(m.id, m);
                          added++;
                      } else if (stamp(m) > stamp(cur)) {
                          byId.set(m.id, m);
                          updated++;
                      }
                  });
                  const merged = Array.from(byId.values()).sort(
                      (a, b) => new Date(b.timestamp) - new Date(a.timestamp)
                  );
                  localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(merged));
                  renderHistory();

                  const skipped = incoming.length - added - updated;
                  let msg = `${added}件を追加しました`;
                  if (updated) msg += `（${updated}件を更新）`;
                  if (skipped) msg += `（${skipped}件は重複のためスキップ）`;
                  showToast(msg);
              };
              reader.readAsText(file);
          }

          function updateMemo(id, text) {
              const history = getHistory();
              const memo = history.find(m => m.id === id);
              if (memo) {
                  memo.text = text;
                  memo.updatedAt = new Date().toISOString();
                  localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
              } else {
                  saveToHistory(text); // 万一元のメモが無ければ新規として保存
              }
          }

          // 履歴のメモを入力欄に読み込んで編集開始（今の下書きは退避）
          function startEdit(memo) {
              if (editingId) {
                  if (editingId === memo.id) {
                      closeHistory();
                  } else {
                      showToast('編集中です。先に更新かキャンセルをしてください');
                  }
                  return;
              }
              stashedDraft = editor.value;
              editingId = memo.id;
              localStorage.setItem(STORAGE_KEY_EDIT, JSON.stringify({ id: memo.id, stash: stashedDraft }));
              editor.value = memo.text;
              localStorage.setItem(STORAGE_KEY_CURRENT, memo.text);
              updateEditUI();
              if (previewing) setPreview(false);
              editor.setSelectionRange(editor.value.length, editor.value.length);
              closeHistory();
          }

          // 編集終了：退避していた下書きを入力欄へ戻す
          function endEdit() {
              editor.value = stashedDraft;
              if (stashedDraft) {
                  localStorage.setItem(STORAGE_KEY_CURRENT, stashedDraft);
              } else {
                  localStorage.removeItem(STORAGE_KEY_CURRENT);
              }
              editingId = null;
              stashedDraft = '';
              localStorage.removeItem(STORAGE_KEY_EDIT);
              updateEditUI();
          }

          function setPreview(on) {
              previewing = on;
              mainArea.classList.toggle('previewing', on);
              btnPreview.classList.toggle('on', on);
              btnPreview.setAttribute('aria-pressed', String(on));
              if (on) {
                  previewEl.innerHTML = '';
                  const text = editor.value.trim();
                  if (text) {
                      renderMemo(previewEl, text);
                  } else {
                      const hint = document.createElement('div');
                      hint.className = 'hint';
                      hint.textContent = 'まだ何も書かれていません';
                      previewEl.appendChild(hint);
                  }
                  previewEl.scrollTop = 0;
                  editor.blur();
              } else {
                  editor.focus();
              }
          }

          function updateEditUI() {
              const on = editingId !== null;
              editBanner.classList.toggle('show', on);
              saveLabel.textContent = on ? '更新して戻る' : '保存して次へ';
          }

          function getHistory() {
              try {
                  const data = localStorage.getItem(STORAGE_KEY_HISTORY);
                  return data ? JSON.parse(data) : [];
              } catch (e) {
                  return [];
              }
          }

          function deleteFromHistory(id) {
              const history = getHistory().filter(memo => memo.id !== id);
              localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
              renderHistory();
          }

          function renderHistory() {
              const history = getHistory();
              historyList.innerHTML = '';

              if (history.length === 0) {
                  historyList.innerHTML = `
                      <div class="empty">
                          ${icon('file', 40)}
                          <p>保存されたメモはありません</p>
                      </div>
                  `;
                  return;
              }

              history.forEach(memo => {
                  const date = new Date(memo.timestamp);
                  const formattedDate = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;

                  const card = document.createElement('div');
                  card.className = 'card';

                  const textDiv = document.createElement('div');
                  textDiv.className = 'card-text collapsed';
                  renderMemo(textDiv, memo.text);
                  // 長いメモはタップで全文表示／折りたたみ（リンクのタップは除く）
                  textDiv.addEventListener('click', (e) => {
                      if (e.target.closest('a')) return;
                      if (textDiv.classList.contains('clamped')) textDiv.classList.toggle('collapsed');
                  });

                  const footer = document.createElement('div');
                  footer.className = 'card-footer';

                  const timeSpan = document.createElement('span');
                  timeSpan.className = 'card-time';
                  timeSpan.textContent = formattedDate;

                  const actionDiv = document.createElement('div');
                  actionDiv.className = 'card-actions';

                  const btnEdit = document.createElement('button');
                  btnEdit.className = 'icon-btn edit';
                  btnEdit.setAttribute('aria-label', '編集');
                  btnEdit.innerHTML = icon('edit', 16);
                  btnEdit.onclick = () => startEdit(memo);

                  const btnCopy = document.createElement('button');
                  btnCopy.className = 'icon-btn copy';
                  btnCopy.setAttribute('aria-label', 'コピー');
                  btnCopy.innerHTML = icon('copy', 16);
                  btnCopy.onclick = () => copyToClipboard(memo.text);

                  const btnDelete = document.createElement('button');
                  btnDelete.className = 'icon-btn del';
                  btnDelete.setAttribute('aria-label', '削除');
                  btnDelete.innerHTML = icon('trash', 16);
                  btnDelete.onclick = () => openConfirmModal(memo.id);

                  actionDiv.appendChild(btnEdit);
                  actionDiv.appendChild(btnCopy);
                  actionDiv.appendChild(btnDelete);
                  footer.appendChild(timeSpan);
                  footer.appendChild(actionDiv);
                  card.appendChild(textDiv);
                  card.appendChild(footer);
                  historyList.appendChild(card);

                  // 高さを超える場合だけ「タップで開閉」を有効にする
                  if (textDiv.scrollHeight > textDiv.clientHeight + 1) {
                      textDiv.classList.add('clamped');
                  }
              });
          }

          // --- メモの書式レンダリング ---
          // 行頭の # の数: 1=タイトル 2=サブタイトル 3=サブサブタイトル 4=原文 5=ひとまわり小さい文
          // メモ全体の1行目は # がなくてもタイトル。それ以外で # がない行は原文(4)
          // ``` で囲んだ部分は（複数行でも）コードブロック
          function renderMemo(container, text) {
              let first = true;
              const parts = [];
              const re = /```([\s\S]*?)```/g;
              let last = 0;
              let m;
              while ((m = re.exec(text)) !== null) {
                  parts.push({ type: 'text', value: text.slice(last, m.index) });
                  parts.push({ type: 'code', value: m[1] });
                  last = re.lastIndex;
              }
              parts.push({ type: 'text', value: text.slice(last) });

              parts.forEach((part, idx) => {
                  if (part.type === 'code') {
                      const pre = document.createElement('pre');
                      pre.className = 'codeblock';
                      const code = document.createElement('code');
                      code.textContent = part.value.replace(/^\r?\n/, '').replace(/\r?\n$/, '');
                      pre.appendChild(code);
                      container.appendChild(pre);
                      first = false;
                      return;
                  }

                  let value = part.value;
                  // コードブロックの前後の改行1つは区切りなので落とす
                  if (idx > 0) value = value.replace(/^\r?\n/, '');
                  if (idx < parts.length - 1) value = value.replace(/\r?\n$/, '');
                  if (value === '') return;

                  value.split('\n').forEach(rawLine => {
                      const line = rawLine.replace(/\r$/, '');
                      let level = 4;
                      let body = line;
                      const hm = line.match(/^(#+)[ 　]?([\s\S]*)$/);
                      if (hm) {
                          level = Math.min(hm[1].length, 5);
                          body = hm[2];
                      } else if (first) {
                          level = 1;
                      }
                      first = false;

                      const div = document.createElement('div');
                      div.className = 'ln h' + level;
                      renderInline(div, body);
                      container.appendChild(div);
                  });
              });
          }

          // 行の中の書式:
          //   **太字**  *斜体*  ***太字斜体***  @@下線@@（@の内側にスペースなし）
          //   ||あああ||  書体指定を消す（中の記号も解釈せずそのまま表示）
          //   [RRR]文字[bbb]  先頭の記号=文字色(大文字) / 末尾の記号=下線色(小文字)
          //   @[YYY]文字[000]@  マーカー（先頭は大文字の色、末尾の 000=黒文字 / FFF=白文字）
          //   URL → 色付き＋下線のリンク
          const PALETTE = {
              R: '#ff0000', O: '#ff8000', Y: '#ffff00', G: '#00ff00',
              C: '#00ffff', B: '#0000ff', M: '#ff00ff', '0': '#000000', F: '#ffffff'
          };

          // [先頭の記号][末尾の記号] から 文字色 と 下線色 を決める
          // 大文字(RRR など)=文字色 / 小文字(rrr など)=下線色 / 000 は先頭なら文字色・末尾なら下線色
          function resolveColorTags(openCode, closeCode) {
              let textColor = null;
              let ulColor = null;
              [[openCode, true], [closeCode, false]].forEach(([code, isOpen]) => {
                  const color = PALETTE[code[0].toUpperCase()];
                  let role;
                  if (code === '000') role = isOpen ? 'text' : 'ul';
                  else role = code[0] === code[0].toUpperCase() ? 'text' : 'ul';
                  if (role === 'text' && textColor === null) textColor = color;
                  if (role === 'ul' && ulColor === null) ulColor = color;
              });
              return { text: textColor, ul: ulColor };
          }

          // 色の終了記号を探す（マーカーの @[..] と [..]@ は除く）
          function findColorTag(text, from) {
              const re = /\[(RRR|rrr|OOO|ooo|YYY|yyy|GGG|ggg|CCC|ccc|BBB|bbb|MMM|mmm|000|FFF|fff)\]/g;
              re.lastIndex = from;
              let m;
              while ((m = re.exec(text)) !== null) {
                  const end = m.index + m[0].length;
                  if (text[m.index - 1] === '@' && text[m.index - 2] !== '@') continue;
                  if ((m[1] === '000' || m[1] === 'FFF') && text[end] === '@' && text[end + 1] !== '@') continue;
                  return { index: m.index, code: m[1] };
              }
              return null;
          }

          // ** * *** @@ の終了位置を探す（中身が空のもの・直前がスペースのものは除く）
          function findCloser(text, from, token) {
              let k = text.indexOf(token, from);
              while (k !== -1) {
                  let ok = k > from && !/\s/.test(text[k - 1]);
                  if (ok && token === '*' && (text[k - 1] === '*' || text[k + 1] === '*')) ok = false;
                  if (ok) return k;
                  k = text.indexOf(token, k + 1);
              }
              return -1;
          }

          // 開始記号の直後がスペースでなく、あとで閉じられるときだけ開始とみなす
          function canOpen(text, i, token) {
              const next = text[i + token.length];
              if (next === undefined || /\s/.test(next)) return false;
              if (token === '*' && next === '*') return false;
              return findCloser(text, i + token.length, token) !== -1;
          }

          function makeStyled(str, st, isLink) {
              const css = [];
              if (st.bold) css.push('font-weight:700');
              if (st.italic) css.push('font-style:italic');
              if (st.ul || st.cul) {
                  css.push('text-decoration:underline', 'text-underline-offset:2px');
                  if (st.cul) css.push('text-decoration-color:' + st.cul);
              }
              const color = st.ctext || st.mfg;
              if (color) css.push('color:' + color);
              if (st.mbg) {
                  css.push('background-color:' + st.mbg, 'padding:0 0.2em', 'border-radius:0.2em',
                           'box-decoration-break:clone', '-webkit-box-decoration-break:clone');
              }
              if (!css.length && !isLink) return document.createTextNode(str);
              const el = document.createElement(isLink ? 'a' : 'span');
              if (isLink) {
                  el.href = str;
                  el.target = '_blank';
                  el.rel = 'noopener noreferrer';
              }
              el.style.cssText = css.join(';');
              el.textContent = str;
              return el;
          }

          // 1行ぶんの文字を左から読んで、書式の状態を切り替えながら要素にしていく
          function renderInline(parent, text) {
              const st = { bold: false, italic: false, ul: false, color: false, ctext: null, cul: null, mbg: null, mfg: null };
              let buf = '';
              const flush = () => {
                  if (buf) parent.appendChild(makeStyled(buf, st, false));
                  buf = '';
              };
              let i = 0;
              while (i < text.length) {
                  const rest = text.slice(i);
                  let m;

                  // ||あああ|| 書体指定を消す
                  if (rest.startsWith('||')) {
                      const j = text.indexOf('||', i + 2);
                      if (j !== -1) {
                          flush();
                          if (j > i + 2) {
                              const span = document.createElement('span');
                              span.className = 'plain';
                              span.textContent = text.slice(i + 2, j);
                              parent.appendChild(span);
                          }
                          i = j + 2;
                      } else {
                          buf += '||';
                          i += 2;
                      }
                      continue;
                  }

                  // @[YYY]文字[000]@ マーカー（開始）
                  if ((m = rest.match(/^@\[(RRR|OOO|YYY|GGG|CCC|BBB|MMM|000|FFF)\]/))) {
                      const closer = text.slice(i + m[0].length).match(/\[(000|FFF)\]@/);
                      if (closer) {
                          flush();
                          st.mbg = PALETTE[m[1][0]];
                          st.mfg = closer[1] === '000' ? '#000000' : '#ffffff';
                      } else {
                          buf += m[0];
                      }
                      i += m[0].length;
                      continue;
                  }
                  // マーカー（終了）
                  if (st.mbg && (m = rest.match(/^\[(000|FFF)\]@/))) {
                      flush();
                      st.mbg = null;
                      st.mfg = null;
                      i += m[0].length;
                      continue;
                  }

                  // 開け閉めする記号: @@ *** ** *
                  const token = rest.startsWith('@@') ? '@@'
                      : rest.startsWith('***') ? '***'
                      : rest.startsWith('**') ? '**'
                      : rest.startsWith('*') ? '*' : null;
                  if (token) {
                      const keys = { '@@': ['ul'], '***': ['bold', 'italic'], '**': ['bold'], '*': ['italic'] }[token];
                      if (keys.every(k => st[k])) {
                          if (i > 0 && !/\s/.test(text[i - 1])) {
                              flush();
                              keys.forEach(k => { st[k] = false; });
                              i += token.length;
                              continue;
                          }
                      } else if (canOpen(text, i, token)) {
                          flush();
                          keys.forEach(k => { st[k] = true; });
                          i += token.length;
                          continue;
                      }
                      buf += token;
                      i += token.length;
                      continue;
                  }

                  // [RRR]文字[bbb] 色
                  if ((m = rest.match(/^\[(RRR|rrr|OOO|ooo|YYY|yyy|GGG|ggg|CCC|ccc|BBB|bbb|MMM|mmm|000|FFF|fff)\]/))) {
                      if (st.color) {
                          flush();
                          st.color = false;
                          st.ctext = null;
                          st.cul = null;
                      } else {
                          const closer = findColorTag(text, i + m[0].length);
                          if (closer) {
                              flush();
                              const r = resolveColorTags(m[1], closer.code);
                              st.color = true;
                              st.ctext = r.text;
                              st.cul = r.ul;
                          } else {
                              buf += m[0];
                          }
                      }
                      i += m[0].length;
                      continue;
                  }

                  // リンク
                  if ((m = rest.match(/^https?:\/\/[A-Za-z0-9\-._~:\/?#!$&()+,;=%]+/))) {
                      const url = m[0].replace(/[.,;:!?)]+$/, ''); // 末尾の句読点は含めない
                      flush();
                      parent.appendChild(makeStyled(url, st, true));
                      i += url.length;
                      continue;
                  }

                  buf += text[i];
                  i++;
              }
              flush();
          }

          function copyToClipboard(text) {
              if (navigator.clipboard && window.isSecureContext) {
                  navigator.clipboard.writeText(text).then(
                      () => showToast('コピーしました'),
                      () => fallbackCopy(text)
                  );
              } else {
                  fallbackCopy(text);
              }
          }

          function fallbackCopy(text) {
              const textArea = document.createElement('textarea');
              textArea.value = text;
              textArea.style.position = 'fixed';
              textArea.style.left = '-999999px';
              textArea.style.top = '-999999px';
              document.body.appendChild(textArea);
              textArea.focus();
              textArea.select();
              try {
                  document.execCommand('copy');
                  showToast('コピーしました');
              } catch (err) {
                  console.error('コピーに失敗しました', err);
              }
              textArea.remove();
          }

          let toastTimeout;
          function showToast(message) {
              toast.textContent = message;
              toast.style.opacity = '1';
              clearTimeout(toastTimeout);
              toastTimeout = setTimeout(() => {
                  toast.style.opacity = '0';
              }, 2000);
          }

          function openConfirmModal(id) {
              memoToDeleteId = id;
              confirmModal.classList.add('open');
          }

          function closeConfirmModal() {
              memoToDeleteId = null;
              confirmModal.classList.remove('open');
          }
      });
